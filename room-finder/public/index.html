<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f7fb"><title>Room Finder · AI Conclave</title><link rel="stylesheet" href="/style.css?v=local-directory"><script type="module" src="/app.js?v=local-directory"></script></head><body>
<header><a class="brand" href="https://aiconclave-dashboard-alpha.pages.dev/"><b>AC</b><span>AI CONCLAVE 2026</span></a><nav><a href="https://aiconclave-dashboard-alpha.pages.dev/">Home</a><button id="refresh" class="primary" hidden>Refresh</button><button id="logout" hidden>Log out</button></nav></header>
<main><section id="login" class="login"><p class="eyebrow">Hospitality desk</p><h1>Room finder</h1><p class="intro">Help every team find their way.</p><form id="login-form"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="primary" id="signin">Sign in</button><p id="login-error" role="alert"></p></form></section>
<section id="finder" hidden><p class="eyebrow">Hospitality desk</p><h1>Where’s your team?</h1><p class="intro">Find their room and table in seconds.</p><form id="search-form" role="search"><label for="query">Team name, team code or team leader</label><div class="search-row"><input id="query" type="search" minlength="2" maxlength="100" autocomplete="off" placeholder="Search for a team…" required></div></form><p id="synced" class="meta"></p><div id="detail" role="region" aria-label="Current room" aria-live="polite"></div><p id="status" role="status">Enter a name or code to get started.</p><div id="results"></div></section></main></body></html>
