<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f7fb"><title>Room Finder · AI Conclave</title><link rel="stylesheet" href="/style.css?v=clean-header"><script type="module" src="/app.js?v=clean-header"></script></head><body>
<header><a class="home-icon" href="https://aiconclave-dashboard-alpha.pages.dev/" aria-label="Home" title="Home"><i class="fas fa-home" aria-hidden="true"></i></a><nav aria-label="Room Finder navigation"><button id="refresh" class="primary" hidden>Refresh</button><button id="logout" hidden>Log out</button></nav></header>
<main><section id="login" class="login"><h1>Room finder</h1><form id="login-form"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="primary" id="signin">Sign in</button><p id="login-error" role="alert"></p></form></section>
<section id="finder" hidden><h1>Room finder</h1><form id="search-form" role="search"><label for="query">Team name, team code or team leader</label><div class="search-row"><input id="query" type="search" minlength="2" maxlength="100" autocomplete="off" placeholder="Search for a team…" required></div></form><p id="synced" class="meta"></p><p id="status" role="status"></p><div id="results"></div></section><section id="detail-page" hidden aria-labelledby="detail-heading"><button id="back-search" class="back-button">← Back to search</button><h1 id="detail-heading" tabindex="-1">Room details</h1><div id="detail" aria-live="polite"></div></section></main></body></html>
