name: Deploy alpha dashboard

on:
  push:
    branches:
      - dashboard-dev-alpha
  workflow_dispatch:

concurrency:
  group: dashboard-alpha
  cancel-in-progress: true

jobs:
  deploy:
    name: Dashboard Pages deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build dashboard
        run: npm run build

      - name: Apply dashboard database migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.38.0"
          command: d1 migrations apply aiconclave-registrations-alpha --remote

      - name: Deploy dashboard Pages project
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.38.0"
          command: pages deploy dist --project-name=aiconclave-dashboard-alpha --branch=dashboard-dev-alpha --commit-dirty=true
